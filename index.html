
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Idol Card Dex</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #dbeaff;
    color: #202e55;
  }
  header {
    text-align: center;
    padding: 36px 16px 24px;
    background: linear-gradient(135deg, #010c29, #202e55, #010c29);
  }
  header h1 { margin: 0 0 8px; letter-spacing: 2px; }
 .site-logo {
  display: block;
  width: min(500px, 90%);
  max-height: 180px;
  object-fit: contain;
  margin: 0 auto 8px;
}
 header p {
  margin: 0;
  color: #d6ce63;
  font-family: "Arial", sans-serif;
  font-weight: bold;
  font-size: 22px;
  letter-spacing: 1px;
}
  nav {
    display: flex;
    justify-content: center;
    gap: 12px;
    padding: 16px;
    background: white;
    border-bottom: 1px solid #eee6f5;
  }
  button, input, select { font: inherit; }
  nav button {
    padding: 10px 22px;
    border: 0;
    border-radius: 24px;
    background: #dbeaff;
    color: #202e55;
    cursor: pointer;
  }
  nav button.active { background: #202e55; color: white; }
  main { max-width: 1400px; margin: auto; padding: 24px; }
  .controls {
    display: flex; flex-wrap: wrap; gap: 10px;
    margin-bottom: 24px;
  }
  input, select {
    padding: 11px 13px;
    border: 1px solid #dbeaff;
    border-radius: 10px;
    background: white;
  }
  input { flex: 1; min-width: 180px; }
  .grid {
    display: grid;
    grid-template-columns: repeat(6, minmax(0, 1fr));
    gap: 20px 14px;
  }
  #memberGrid {
    grid-template-columns: repeat(var(--group-columns, 5), minmax(0, 1fr));
  }

.card {
  text-align: center;
  cursor: pointer;
  min-width: 0;
  perspective: 800px;
}

.card-art {
  touch-action: pan-y;
  position: relative;
  overflow: hidden;
  border-radius: 16px;
  aspect-ratio: 5 / 7;
  background: #eee7f5;
  box-shadow: 0 3px 10px #34224b20;
  transform: rotateX(var(--tilt-x, 0deg)) rotateY(var(--tilt-y, 0deg));
  transition: transform .12s ease-out, box-shadow .2s;
  transform-style: preserve-3d;
}

.card-art img {
  width: 100%;
  height: 100%;
  display: block;
  object-fit: contain;
  pointer-events: none;
  user-select: none;
  -webkit-user-drag: none;
}
.modal-card-art {
  width: min(360px, 80vw);
  aspect-ratio: 5 / 7;
  height: auto;
  margin: auto;
  overflow: hidden;
  border-radius: 16px;
  transform: rotateX(var(--tilt-x, 0deg)) rotateY(var(--tilt-y, 0deg));
  transform-style: preserve-3d;
}

.modal-card-art img {
  width: 100%;
  height: 100%;
  display: block;
  object-fit: fill;
  padding: 0;
  margin: 0;
  pointer-events: none;
  user-select: none;
  -webkit-user-drag: none;
}

.card-art::after {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
  opacity: var(--shine-opacity, 0);

    background:
  linear-gradient(
    135deg,
    transparent 0%,
    transparent 20%,
    rgba(255, 0, 0, .64) 24.5%,
    rgba(255, 80, 0, .675) 26%,
    rgba(0, 255, 0, .675) 29%,
    rgba(0, 100, 255, .675) 32%,
    rgba(100, 0, 255, .64) 35.5%,
    transparent 40%,
    transparent 60%,
    rgba(255, 0, 0, .64) 60.5%,
    rgba(255, 80, 0, .675) 62%,
    rgba(0, 255, 0, .675) 65%,
    rgba(0, 100, 255, .675) 68%,
    rgba(100, 0, 255, .64) 71.5%,
    transparent 76%,
    transparent 100%
  );

  background-size: 200% 200%;
  background-position:
    var(--shine-x, 50%) var(--shine-y, 50%);

  mix-blend-mode: color-dodge;
  filter: saturate(2);
  transition: opacity .15s;
}

.card:hover .card-art {
  box-shadow: 0 10px 25px #34224b35;
}

.card h3 {
  font-size: 14px;
  margin: 9px 0 4px;
}

.card p {
  font-size: 12px;
  color: #202e55;
  margin: 0;
}

@media (hover: none) {
  .card-art {
    transition: box-shadow .2s;
  }
}

  /* Groups gallery: 2 group photos per row */
  .group-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 18px;
    max-width: 900px;
    margin: 0 auto;
  }
  .group {
    background: white;
    border-radius: 14px;
    overflow: hidden;
    cursor: pointer;
    box-shadow: 0 3px 12px #34224b12;
  }
  .group img {
    width: 100%;
    aspect-ratio: 4 / 3;
    object-fit: cover;
    display: block;
    background: #eee7f5;
  }
  .group h3 { text-align: center; padding: 12px; margin: 0; }
  .back {
    margin-bottom: 18px;
    padding: 9px 14px;
    border: 0;
    border-radius: 10px;
    background: #202e55;
    color: white;
    cursor: pointer;
  }
  .hidden { display: none !important; }
  .status { padding: 20px; text-align: center; color: #796d87; }
  .error { color: #a12b52; }
  .group-heading { margin-top: 0; }

  /* Smaller expanded card preview */
  .modal {
    position: fixed;
    inset: 0;
    background: #171020e8;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
    z-index: 10;
  }
 .modal img {
  width: 100%;
  height: 100%;
  max-width: none;
  max-height: none;
  object-fit: fill;
  border-radius: 0;
  box-shadow: none;
}
  .close {
    position: absolute;
    top: 18px;
    right: 22px;
    color: white;
    background: none;
    border: 0;
    font-size: 32px;
    cursor: pointer;
  }

  @media (max-width: 900px) {
    .grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    #memberGrid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  }
  @media (max-width: 560px) {
    main { padding: 16px; }
    .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px 12px; }
    #memberGrid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .group-grid { gap: 10px; }
    .group h3 { font-size: 14px; padding: 9px 5px; }
    header { padding-top: 28px; }
    header h1 { font-size: 24px; }
  }
.group-sort {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 16px;
}

.group-sort select {
  padding: 8px 10px;
  border-radius: 8px;
  border: 1px solid #ccc;
  background: white;
  color: #222;
  font: inherit;
  cursor: pointer;
}
</style>
</head>
<body>
<header>
  <img src="images/bannerlogo.png" alt="DKing Kustomz" class="site-logo">
  <p>✦ Idol Card Dex ✦</p>
</header>

<nav>
  <button id="allTab" class="active" type="button">All Cards</button>
  <button id="groupsTab" type="button">Groups</button>
</nav>

<main>
  <section id="allSection">
    <div class="controls">
      <input id="search" placeholder="Search idol or card number..." aria-label="Search cards">
      <select id="groupFilter" aria-label="Filter by group">
        <option value="">All groups</option>
      </select>
      <select id="typeFilter" aria-label="Filter by type">
        <option value="">All types</option>
      </select>
    </div>
    <div id="cardStatus" class="status">Loading cards…</div>
    <div id="cardGrid" class="grid"></div>
  </section>

 <section id="groupsSection" class="hidden">
  <div id="groupStatus" class="status">Loading groups…</div>

  <div class="group-sort">
    <label for="groupSort">Sort by:</label>
    <select id="groupSort">
      <option value="old-new">Oldest → Newest</option>
      <option value="new-old">Newest → Oldest</option>
      <option value="alphabetical">Alphabetical (A–Z)</option>
    </select>
  </div>

  <div id="groupGrid" class="group-grid"></div>
  <div id="groupDetail" class="hidden">
    <button class="back" id="backButton" type="button">← All groups</button>
    <h2 id="groupTitle" class="group-heading"></h2>
    <p id="groupCount"></p>
    <div id="memberGrid" class="grid"></div>
  </div>
  </section>
</main>

<div id="modal" class="modal hidden" role="dialog" aria-modal="true" aria-label="Card preview">
  <button class="close" id="closeButton" aria-label="Close" type="button">×</button>
  <div id="modalCardArt" class="card-art modal-card-art">
    <img id="modalImage" alt="Enlarged card" draggable="false">
  </div>
</div>

<script>
/*
  Cards columns:
  Set, Group, Number, Card, Image, Type, Show on Site

  Groups columns:
  Set, Group, Group Photo, Cards per Row, Show on Site

  Image folders:
  images/cards/
  images/groups/
*/
const CARDS_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRPo-0Xov1rDVFvVUCRqPxpAmOO_KBs4e5k9Q6H5Cp5wCaLJXT_ShDQMKSo2ITWv3h3aoVPxbub4DRq/pub?gid=0&single=true&output=csv";
const GROUPS_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRPo-0Xov1rDVFvVUCRqPxpAmOO_KBs4e5k9Q6H5Cp5wCaLJXT_ShDQMKSo2ITWv3h3aoVPxbub4DRq/pub?gid=1324230279&single=true&output=csv";

const CARD_IMAGE_FOLDER = "images/cards/";
const GROUP_IMAGE_FOLDER = "images/groups/";

let cards = [];
let groups = [];

function truthy(value) {
  return ["true", "yes", "1", "y"].includes(String(value ?? "").trim().toLowerCase());
}
function clean(value) {
  return String(value ?? "").trim();
}
function normaliseHeader(value) {
  return clean(value).toLowerCase().replace(/[\s_-]+/g, "");
}
function parseCSV(text) {
  const rows = [];
  let row = [], field = "", quoted = false;

  for (let i = 0; i < text.length; i++) {
    const ch = text[i];

    if (ch === '"') {
      if (quoted && text[i + 1] === '"') {
        field += '"';
        i++;
      } else {
        quoted = !quoted;
      }
    } else if (ch === "," && !quoted) {
      row.push(field);
      field = "";
    } else if ((ch === "\n" || ch === "\r") && !quoted) {
      if (ch === "\r" && text[i + 1] === "\n") i++;
      row.push(field);
      field = "";
      if (row.some(cell => clean(cell) !== "")) rows.push(row);
      row = [];
    } else {
      field += ch;
    }
  }

  if (field.length || row.length) {
    row.push(field);
    if (row.some(cell => clean(cell) !== "")) rows.push(row);
  }

  if (!rows.length) return [];

  const headers = rows.shift().map(normaliseHeader);
  return rows.map(values => {
    const obj = {};
    headers.forEach((header, i) => {
      if (header) obj[header] = clean(values[i]);
    });
    return obj;
  });
}

async function fetchCSV(url) {
  const response = await fetch(url, { cache: "no-store" });
  if (!response.ok) {
    throw new Error("Could not load published spreadsheet (HTTP " + response.status + ").");
  }

  const text = await response.text();
  if (!text || text.trim().startsWith("<!DOCTYPE html")) {
    throw new Error("Google Sheets did not return CSV data. Check that the tab is published as CSV.");
  }
  return parseCSV(text);
}

function imagePath(folder, filename) {
  const name = clean(filename);
  if (!name) return "";
  if (/^https?:\/\//i.test(name)) return name;
  return folder + name.split("/").map(encodeURIComponent).join("/");
}

function numberValue(value) {
  const parsed = Number(clean(value).replace(/^#/, ""));
  return Number.isFinite(parsed) ? parsed : Number.MAX_SAFE_INTEGER;
}

function cardFromRow(row) {
  return {
    set: row.set || "",
    group: row.group || "",
    number: row.number || "",
    member: row.card || "",
    image: imagePath(CARD_IMAGE_FOLDER, row.image),
    type: row.type || "",
    show: truthy(row.showonsite)
  };
}

function groupFromRow(row) {
  const parsedColumns = parseInt(row.cardsperrow, 10);
  return {
    set: row.set || "",
    name: row.group || "",
    image: imagePath(GROUP_IMAGE_FOLDER, row.groupphoto),
    columns: Number.isFinite(parsedColumns) && parsedColumns > 0 ? Math.min(parsedColumns, 12) : 5,
    show: truthy(row.showonsite)
  };
}

function showAll() {
  document.getElementById("allSection").classList.remove("hidden");
  document.getElementById("groupsSection").classList.add("hidden");
  document.getElementById("allTab").classList.add("active");
  document.getElementById("groupsTab").classList.remove("active");
}

function showGroups() {
  document.getElementById("allSection").classList.add("hidden");
  document.getElementById("groupsSection").classList.remove("hidden");
  document.getElementById("allTab").classList.remove("active");
  document.getElementById("groupsTab").classList.add("active");
  document.getElementById("groupGrid").classList.remove("hidden");
  document.getElementById("groupDetail").classList.add("hidden");
}

function cardElement(card) {
  const el = document.createElement("div");
  el.className = "card";

  const art = document.createElement("div");
  art.className = "card-art";

  const img = document.createElement("img");
  img.src = card.image;
  img.alt = card.member || "Card";
  img.loading = "lazy";
  img.draggable = false;
  img.onerror = () => { img.style.visibility = "hidden"; };

  art.append(img);

  const name = document.createElement("h3");
  name.textContent = card.member || "Unnamed card";

  const caption = document.createElement("p");
  caption.textContent =
    `${card.group}${card.number ? " · #" + card.number : ""}`;

  el.append(art, name, caption);
  el.tabIndex = 0;
  el.setAttribute("role", "button");
  el.setAttribute("aria-label", "Preview " + (card.member || "card"));

  // Discourage right-click saving/opening and image dragging.
  el.addEventListener("contextmenu", e => e.preventDefault());
  el.addEventListener("dragstart", e => e.preventDefault());

  // Mouse-controlled tilt and holographic shine.
  el.addEventListener("pointermove", e => {

    const rect = art.getBoundingClientRect();
    const x = (e.clientX - rect.left) / rect.width;
    const y = (e.clientY - rect.top) / rect.height;

    art.style.setProperty("--tilt-y", `${(x - 0.5) * 24}deg`);
    art.style.setProperty("--tilt-x", `${(0.5 - y) * 24}deg`);
    art.style.setProperty("--shine-x", `${x * 100}%`);
    art.style.setProperty("--shine-y", `${y * 100}%`);
    art.style.setProperty("--shine-angle", `${120 + x * 100}deg`);
    art.style.setProperty("--shine-opacity", "1");
  });

  el.addEventListener("pointerleave", () => {
    art.style.setProperty("--tilt-x", "0deg");
    art.style.setProperty("--tilt-y", "0deg");
    art.style.setProperty("--shine-opacity", "0");
  });

  const open = () => {
    document.getElementById("modalImage").src = card.image;
    document.getElementById("modal").classList.remove("hidden");
  };

  el.addEventListener("click", open);
  el.addEventListener("keydown", e => {
    if (e.key === "Enter" || e.key === " ") {
      e.preventDefault();
      open();
    }
  });

  return el;
}
 const modalCardArt = document.getElementById("modalCardArt");
const modalImage = document.getElementById("modalImage");

// Discourage right-click saving and dragging in the expanded preview.
modalCardArt.addEventListener("contextmenu", e => e.preventDefault());
modalCardArt.addEventListener("dragstart", e => e.preventDefault());

// Apply the same mouse-controlled tilt and rainbow shine.
modalCardArt.addEventListener("pointermove", e => {

  const rect = modalCardArt.getBoundingClientRect();
  const x = (e.clientX - rect.left) / rect.width;
  const y = (e.clientY - rect.top) / rect.height;

  modalCardArt.style.setProperty("--tilt-y", `${(x - 0.5) * 24}deg`);
  modalCardArt.style.setProperty("--tilt-x", `${(0.5 - y) * 24}deg`);
  modalCardArt.style.setProperty("--shine-x", `${x * 100}%`);
  modalCardArt.style.setProperty("--shine-y", `${y * 100}%`);
  modalCardArt.style.setProperty("--shine-angle", `${120 + x * 100}deg`);
  modalCardArt.style.setProperty("--shine-opacity", "1");
});

modalCardArt.addEventListener("pointerleave", () => {
  modalCardArt.style.setProperty("--tilt-x", "0deg");
  modalCardArt.style.setProperty("--tilt-y", "0deg");
  modalCardArt.style.setProperty("--shine-opacity", "0");
});

// Also prevent dragging or opening the image directly.
modalImage.draggable = false;
modalImage.addEventListener("contextmenu", e => e.preventDefault());
modalImage.addEventListener("dragstart", e => e.preventDefault());

function renderCards(list = cards) {
  const search = document.getElementById("search").value.trim().toLowerCase();
  const group = document.getElementById("groupFilter").value;
  const type = document.getElementById("typeFilter").value;

  const filtered = list.filter(c =>
    (`${c.member} ${c.number} ${c.group} ${c.type}`).toLowerCase().includes(search) &&
    (!group || c.group === group) &&
    (!type || c.type.toLowerCase() === type.toLowerCase())
  );

  const grid = document.getElementById("cardGrid");
  grid.replaceChildren(...filtered.map(cardElement));

  document.getElementById("cardStatus").textContent = filtered.length
    ? `${filtered.length} card${filtered.length === 1 ? "" : "s"}`
    : "No cards match. Check your spreadsheet entries and Show on Site settings.";
}

function openGroup(name) {
  const g = groups.find(x => x.name === name);
  const list = cards.filter(c => c.group === name)
    .sort((a, b) => numberValue(a.number) - numberValue(b.number));

  document.getElementById("groupGrid").classList.add("hidden");
  document.getElementById("groupDetail").classList.remove("hidden");
  document.getElementById("groupTitle").textContent = name;
  document.getElementById("groupCount").textContent = `${list.length} card${list.length === 1 ? "" : "s"}`;

  const grid = document.getElementById("memberGrid");
  grid.style.setProperty("--group-columns", g ? g.columns : 5);
  grid.replaceChildren(...list.map(cardElement));
}

function backToGroups() {
  document.getElementById("groupGrid").classList.remove("hidden");
  document.getElementById("groupDetail").classList.add("hidden");
}

function closeModal() {
  document.getElementById("modal").classList.add("hidden");
  document.getElementById("modalImage").removeAttribute("src");
}

function fillSelect(select, values) {
  const first = select.options[0];
  select.replaceChildren(first);
  values.forEach(value => select.add(new Option(value, value)));
}

function renderGroups() {
  const gg = document.getElementById("groupGrid");
  const sortBy = document.getElementById("groupSort").value;

  const sortedGroups = [...groups].sort((a, b) => {
    if (sortBy === "alphabetical") {
      return a.name.localeCompare(b.name);
    }

    const setA = numberValue(a.set);
    const setB = numberValue(b.set);

    if (sortBy === "new-old") {
      return setB - setA;
    }

    return setA - setB;
  });

  gg.replaceChildren(...sortedGroups.map(g => {
    const el = document.createElement("div");
    el.className = "group";

    const img = document.createElement("img");
    img.src = g.image || "";
    img.alt = g.name;
    img.loading = "lazy";
    img.onerror = () => { img.style.visibility = "hidden"; };

    const title = document.createElement("h3");
    title.textContent = g.name;

    el.append(img, title);
    el.addEventListener("click", () => openGroup(g.name));
    return el;
  }));
}
 document.getElementById("groupSort").addEventListener("change", renderGroups);

async function init() {
  const cardStatus = document.getElementById("cardStatus");
  const groupStatus = document.getElementById("groupStatus");

  try {
    const [cardRows, groupRows] = await Promise.all([
      fetchCSV(CARDS_CSV_URL),
      fetchCSV(GROUPS_CSV_URL)
    ]);

    groups = groupRows.map(groupFromRow).filter(g => g.name && g.show);
    const visibleGroupNames = new Set(groups.map(g => g.name));

    cards = cardRows.map(cardFromRow)
      .filter(c => c.member && c.image && c.show && visibleGroupNames.has(c.group))
      .sort((a, b) => numberValue(a.number) - numberValue(b.number));

    fillSelect(
      document.getElementById("groupFilter"),
      [...new Set(cards.map(c => c.group))]
    );
    fillSelect(
      document.getElementById("typeFilter"),
      [...new Set(cards.map(c => c.type).filter(Boolean))]
    );

    renderCards();
    renderGroups();
    groupStatus.textContent = `${groups.length} groups`;
    groupStatus.classList.remove("hidden");
  } catch (error) {
    console.error(error);
    cardStatus.classList.add("error");
    groupStatus.classList.add("error");

    cardStatus.textContent = "Couldn't load the spreadsheet. Check that both tabs are published as CSV and that the links are correct, then refresh this page.";
    groupStatus.textContent = "Couldn't load groups. Check the published Groups CSV link and refresh.";
  }
}

document.getElementById("allTab").addEventListener("click", showAll);
document.getElementById("groupsTab").addEventListener("click", showGroups);
document.getElementById("backButton").addEventListener("click", backToGroups);
document.getElementById("closeButton").addEventListener("click", closeModal);

document.getElementById("modal").addEventListener("click", e => {
  if (e.target.id === "modal") closeModal();
});

document.getElementById("search").addEventListener("input", () => renderCards());
document.getElementById("groupFilter").addEventListener("change", () => renderCards());
document.getElementById("typeFilter").addEventListener("change", () => renderCards());

document.addEventListener("keydown", e => {
  if (e.key === "Escape") closeModal();
});

init();
</script>
</body>
</html>
